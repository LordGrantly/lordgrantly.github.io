<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: red;
        }
    </style>
</head>
<body>
    <div id="text">Tap the screen to start</div>
    
    <script>
        let Who = Math.floor(Math.random() * 3) + 1;
        let number = Math.floor(Math.random() * 800) + 1;
        let clicked = 1;
        document.addEventListener('click', function() {
            var textElement = document.getElementById('text');
            clicked++;
            if (Who === 2*clicked) {
                textElement.textContent = 'You are the impostor!';
            } else if (clicked % 2 === 0) {
                textElement.textContent = 'number: ' + number;
            }else {
                textElement.textContent = 'Next player';
            }
            if (clicked > 6) {
                clicked = 0;
                Who = Math.floor(Math.random() * 3) + 1;
                number = Math.floor(Math.random() * 800) + 1;
                textElement.textContent = 'Tap the screen to start';
            }
        });
    </script>
</body>
</html>
